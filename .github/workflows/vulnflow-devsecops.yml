# VulnFlow DevSecOps with the organisation key (OIDC): the setup page's template, plus release branches and tags.
name: VulnFlow DevSecOps
on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  vulnflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VulnFlow DevSecOps scan
        env:
          VULNFLOW_URL: https://demo.vulnflow.com
          VULNFLOW_KEY: ${{ secrets.VULNFLOW_ORG_KEY }}
          VULNFLOW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash .github/spoof.sh
