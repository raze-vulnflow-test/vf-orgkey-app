# Test only: the dangerous pattern, a pull_request_target job that checks out the fork's code with the base's secrets.
name: VulnFlow DevSecOps (pull_request_target)
on: pull_request_target
permissions:
  contents: read
  id-token: write
jobs:
  vulnflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: VulnFlow DevSecOps scan
        env:
          VULNFLOW_URL: https://demo.vulnflow.com
          VULNFLOW_KEY: ${{ secrets.VULNFLOW_ORG_KEY }}
          VULNFLOW_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsS "$VULNFLOW_URL/api/dast/devsecops/pipeline/script" -o vulnflow-devsecops.sh
          bash vulnflow-devsecops.sh
